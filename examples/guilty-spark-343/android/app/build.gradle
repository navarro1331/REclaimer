plugins { id 'com.android.application' }

android {
    namespace 'com.guiltyspark343.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.guiltyspark343.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'com.guiltyspark343.android.SmokeInstrumentation'
    }
    buildTypes {
        debug { }
        release {
            // Personal sideload build. Replace with an operator-owned release key before publication.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
